name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8"));console.log("Vulnerability summary:",JSON.stringify(r.metadata?.vulnerabilities??{}));for(const [name,v] of Object.entries(r.vulnerabilities??{}))console.log(name+" | severity="+v.severity+" | direct="+v.isDirect+" | fixAvailable="+JSON.stringify(v.fixAvailable))'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build project
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
