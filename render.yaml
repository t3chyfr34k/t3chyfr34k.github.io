services:
  - type: web
    name: technology-security-data-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_DEPLOY_TARGET
        value: render
    routes:
      - type: rewrite
        source: /*
        destination: /index.html